name: Build NotiBox APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Updated to v5 to remove the deprecation warning
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Updated setup-gradle action
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Grant executable permissions IF the wrapper exists, otherwise ignore
      - name: Make gradlew executable
        run: chmod +x gradlew || true

      # Use 'gradle' instead of './gradlew' so it works even without the wrapper files
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiBox-APK
          path: app/build/outputs/apk/debug/*.apk
